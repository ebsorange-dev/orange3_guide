<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- 외곽 원 (polarization 회전축) -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="#444" stroke-width="2"/>
  <!-- 4 방향 각도 축 (0°, 45°, 90°, 135°) -->
  <line x1="24" y1="4" x2="24" y2="44" stroke="#888" stroke-width="1.2"/>
  <line x1="4" y1="24" x2="44" y2="24" stroke="#888" stroke-width="1.2"/>
  <line x1="9.86" y1="9.86" x2="38.14" y2="38.14" stroke="#888" stroke-width="1.2"/>
  <line x1="9.86" y1="38.14" x2="38.14" y2="9.86" stroke="#888" stroke-width="1.2"/>
  <!-- 4 방향 화살표 머리 (4+ Angle 강조) -->
  <polygon points="24,4 21,9 27,9" fill="#3879d9"/>
  <polygon points="44,24 39,21 39,27" fill="#3879d9"/>
  <polygon points="24,44 27,39 21,39" fill="#3879d9"/>
  <polygon points="4,24 9,27 9,21" fill="#3879d9"/>
  <!-- 중앙 점 -->
  <circle cx="24" cy="24" r="2.5" fill="#3879d9"/>
</svg>
