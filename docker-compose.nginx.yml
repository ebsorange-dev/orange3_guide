# =============================================================================
# Nginx 정적 오프로드 — 운영 무중단 opt-in 오버레이
# =============================================================================
# 사용:
#   1) 검증 단계 (포트 8889 로 별도 노출, 기존 8888 그대로 유지):
#      docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d nginx
#      → http://localhost:8889 로 nginx 경유 동작 확인 가능
#
#   2) 전환 단계 (외부 8888 을 nginx 로 변경):
#      docker-compose.yml 의 session-manager.ports 에서 "8888:8080" 제거
#      docker-compose.nginx.yml 의 nginx.ports 를 "8888:80" 으로 변경
#      docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d
#
#   3) 롤백:
#      docker compose stop nginx
#      docker-compose.yml 의 session-manager.ports 복원
#      docker compose up -d session-manager
# =============================================================================

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: orange3-nginx
    restart: unless-stopped
    ports:
      # 검증 단계: 8889 로 노출 (기존 8888 session-manager 와 병행)
      # 전환 단계: 8888 로 변경 + session-manager 의 8888 매핑 제거
      - "8889:80"
    volumes:
      # nginx 설정 (수정 시 docker exec orange3-nginx nginx -s reload 로 적용)
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 커스텀 에러 페이지 (502/503/504/404) — upstream 죽었을 때 친화 메시지
      - ./nginx/errors:/etc/nginx/errors:ro
      # 정적 자산: session-manager 와 동일한 호스트 경로를 ro 로 공유
      - ./html:/srv/html:ro
      - ./session_manager/orange_logo.png:/srv/orange_logo.png:ro
    depends_on:
      - session-manager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

# session-manager 가 같은 default network 에 있어야 nginx upstream 이
# orange3-session-manager:8080 으로 해석됨. 기본 compose 가 자동 구성하므로
# 별도 networks 정의 없음.
