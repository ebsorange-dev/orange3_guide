<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orange3 Datasets — Compact</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "맑은 고딕", sans-serif;
    background: #ffffff; color: #1f1f23;
    height: 100vh; overflow: hidden;
  }
  .top-bar {
    display: flex; align-items: center;
    padding: 0 12px; border-bottom: 1px solid #e5e7eb;
    background: #ffffff; height: 36px;
  }
  .brand {
    display: flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: 14px; color: #1f1f23;
  }
  .brand-icon {
    width: 16px; height: 16px;
    display: flex; flex-direction: column; gap: 2px; justify-content: center;
  }
  .brand-icon span { background: #1f1f23; height: 2px; border-radius: 1px; }

  /* 닫기 버튼 (orange3_analysis_datasets.html .close-btn 참조) */
  .close-btn {
    margin-left: auto;
    background: transparent; border: none; color: #9ca3af;
    cursor: pointer; width: 28px; height: 28px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    padding: 0; flex-shrink: 0;
    transition: color 0.12s;
  }
  .close-btn:hover { color: #4b5563; background: transparent; }
  .close-btn svg { display: block; }

  .body-wrap { display: flex; height: calc(100vh - 36px); }
  body.modal-mode .body-wrap { height: calc(100vh - 36px - 48px); }

  .modal-footer {
    display: none; align-items: center; justify-content: space-between;
    padding: 8px 14px; border-top: 1px solid #e5e7eb;
    background: #ffffff; height: 48px;
  }
  body.modal-mode .modal-footer { display: flex; }
  .footer-info {
    font-size: 12px; color: #6b7280;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 12px;
  }
  .footer-info b { color: #1e3a8a; font-weight: 600; }
  .footer-info code {
    font-family: "Consolas", monospace; background: #f1f3f5; color: #374151;
    padding: 1px 5px; border-radius: 3px; font-size: 11px;
  }
  .footer-buttons { display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    padding: 6px 14px; border-radius: 6px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    border: 1px solid transparent; transition: background 0.1s, border-color 0.1s;
  }
  .btn-cancel { background: #ffffff; border-color: #d1d5db; color: #4b5563; }
  .btn-cancel:hover { background: #f3f4f6; }
  .btn-apply { background: #2563eb; color: #ffffff; }
  .btn-apply:hover { background: #1d4ed8; }
  .btn-apply:disabled { background: #93c5fd; cursor: not-allowed; }

  .sidebar {
    width: 200px; flex-shrink: 0;
    background: #f9fafb; border-right: 1px solid #e5e7eb;
    overflow-y: auto; padding: 8px 6px; scrollbar-width: thin;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar-title {
    font-size: 10.5px; font-weight: 600; color: #9ca3af;
    text-transform: uppercase; letter-spacing: 0.4px; padding: 4px 10px 6px;
  }
  .tab {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; color: #4b5563; font-size: 12.5px;
    cursor: pointer; border-radius: 6px; margin-bottom: 1px;
    border-left: 3px solid transparent;
    transition: color 0.12s, background 0.12s, border-color 0.12s;
  }
  .tab:hover { color: #1f1f23; background: #f1f3f5; }
  .tab.active {
    color: #1e3a8a; font-weight: 600; background: #dbeafe;
    border-left-color: #2563eb;
  }
  .tab .tab-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .tab .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .count {
    background: #e5e7eb; color: #6b7280;
    padding: 1px 7px; border-radius: 999px;
    font-size: 10.5px; font-weight: 600; flex-shrink: 0;
  }
  .tab.active .count { background: #2563eb; color: #ffffff; }

  .dot-all            { background: #6b7280; }
  .dot-classification { background: #3b82f6; }
  .dot-regression     { background: #ef4444; }
  .dot-clustering     { background: #f59e0b; }
  .dot-text           { background: #8b5cf6; }
  .dot-image          { background: #06b6d4; }
  .dot-timeseries     { background: #10b981; }
  .dot-bio            { background: #ec4899; }
  .dot-misc           { background: #9ca3af; }

  .main {
    flex: 1; height: 100%; overflow-y: auto;
    padding: 4px 12px 16px; background: #f8f9fb;
  }
  .section-title {
    font-size: 13px; font-weight: 700; margin: 6px 0 2px;
    color: #111827; display: flex; align-items: baseline;
    gap: 5px; line-height: 1.2;
  }
  .section-title:first-of-type { margin-top: 2px; }
  .section-title .count { font-size: 10.5px; font-weight: 500; color: #6b7280; }

  .list {
    background: #ffffff; border: 1px solid #e5e7eb;
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .list-header, .list-row {
    display: grid;
    grid-template-columns: 50px 22px 1fr 1.8fr 100px;
    gap: 8px; align-items: center;
  }
  .list-header {
    padding: 7px 10px; background: #f9fafb;
    border-bottom: 1px solid #e5e7eb;
    font-size: 10.5px; font-weight: 600; color: #6b7280;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .list-row {
    padding: 7px 10px; border-bottom: 1px solid #f1f3f5;
    font-size: 12px; cursor: pointer; transition: background 0.1s;
  }
  .list-row:last-child { border-bottom: none; }
  .list-row:hover { background: #f9fafb; }
  .list-row.selected { background: #dbeafe; border-bottom-color: #bfdbfe; }
  .list-row.selected:hover { background: #c7defb; }
  .list-row.selected .col-title { color: #1e3a8a; }

  .col-select { display: flex; align-items: center; justify-content: center; }
  .radio {
    appearance: none; -webkit-appearance: none;
    width: 15px; height: 15px;
    border: 1.5px solid #c4cad1; border-radius: 50%;
    background: #ffffff; cursor: pointer; position: relative;
    transition: border-color 0.12s, background 0.12s; flex-shrink: 0;
  }
  .radio:hover { border-color: #2563eb; }
  .radio:checked { border-color: #2563eb; background: #2563eb; }
  .radio:checked::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 6px; height: 6px; border-radius: 50%; background: #ffffff;
  }
  .list-dot { width: 9px; height: 9px; border-radius: 50%; margin: 0 auto; }

  .col-title { color: #111827; font-weight: 600; font-size: 12px; line-height: 1.35; }
  .col-title .file {
    display: block; font-size: 10px; font-weight: 400; color: #6b7280;
    margin-top: 2px; line-height: 1.3;
    font-family: "Consolas", "Courier New", monospace;
  }
  .loc-icon {
    font-size: 10px; margin-left: 3px; opacity: 0.7;
    cursor: help; vertical-align: middle;
  }
  .loc-icon:hover { opacity: 1; }
  .col-desc {
    color: #4b5563; font-size: 11.5px; line-height: 1.2;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .col-meta {
    font-size: 10.5px; color: #6b7280; font-family: "Consolas", monospace;
    display: flex; flex-direction: column; gap: 1px; line-height: 1.3;
  }
  .col-meta .meta-rows { color: #374151; font-weight: 600; }
  .col-meta .meta-feat { color: #6b7280; }
  .empty {
    text-align: center; padding: 20px; color: #9ca3af;
    background: #ffffff; border: 1px solid #e5e7eb;
    border-radius: 6px; font-size: 12.5px;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

  @media (max-width: 640px) {
    .list-header, .list-row {
      grid-template-columns: 40px 20px 1fr 80px; gap: 6px;
    }
    .col-desc,
    .list-header > div:nth-child(4) { display: none; }
  }
</style>
</head>

function _ui(k){ var m=UI_I18N[k]; if(!m) return ''; return (LANG!=='ko'&&m[LANG]!=null)?m[LANG]:m.ko; }
function _catLbl(cat){ var m=CAT_LABEL_I18N[cat]; return (LANG!=='ko'&&m&&m[LANG])||categoryLabels[cat]; }
function _tabLbl(it){ var m=TAB_I18N[it.key]; return (LANG!=='ko'&&m&&m[LANG])||it.label; }
function _dsc(d){ var m=DESC_I18N[d.file]; return (LANG!=='ko'&&m&&m[LANG])||d.desc; }
function applyStaticI18n(){
  var bc=document.getElementById('btnCancel'); if(bc) bc.textContent=_ui('cancel');
  var ba=document.getElementById('btnApply'); if(ba) ba.textContent=_ui('apply');
  var fi=document.getElementById('footerInfo'); if(fi && !selectedDataset) fi.textContent=_ui('noSelection');
}

// URL 파라미터 ?cat=<key> 가 있고 유효한 키면 해당 탭으로 시작 (예: ?cat=text)
let currentFilter = "all";
try {
  const _urlCat = new URLSearchParams(window.location.search).get("cat");
  if (_urlCat && tabItems.some(it => it.key === _urlCat)) {
    currentFilter = _urlCat;
  }
} catch (_) { /* SSR 등 환경에서 URL 미지원 시 무시 */ }
let selectedId = null;
let selectedDataset = null;
const IS_MODAL = (window.parent && window.parent !== window);
if (IS_MODAL) document.body.classList.add("modal-mode");

function findById(id) { return datasets.find(d => `${d.cat}_${d.file}` === id) || null; }

function selectRow(id) {
  selectedId = id;
  selectedDataset = findById(id);
  document.querySelectorAll(".list-row").forEach(row => {
    if (row.dataset.id === id) {
      row.classList.add("selected");
      const r = row.querySelector(".radio"); if (r) r.checked = true;
    } else {
      row.classList.remove("selected");
      const r = row.querySelector(".radio"); if (r) r.checked = false;
    }
  });
  if (IS_MODAL && selectedDataset) {
    const fi = document.getElementById("footerInfo");
    if (fi) fi.innerHTML =
      `${_ui('selected')}<b>${selectedDataset.title}</b> → <code>${selectedDataset.serverUrl || _ui('noPath')}</code>`;
    const btn = document.getElementById("btnApply");
    if (btn) btn.disabled = !selectedDataset.serverUrl;
  }
}

function applySelection() {
  if (!selectedDataset || !selectedDataset.serverUrl) return;
  if (window.parent && window.parent !== window) {
    window.parent.postMessage(
      { type: "dataset-selected", path: selectedDataset.serverUrl,
        file: selectedDataset.file, title: selectedDataset.title }, "*");
  }
}
function cancelSelection() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "dataset-cancelled" }, "*");
  }
}

function buildTabs() {
  const bar = document.getElementById("tabBar");
  bar.innerHTML = tabItems.map(it => {
    const count = it.key === "all" ? datasets.length : datasets.filter(d => d.cat === it.key).length;
    return `
      <div class="tab ${it.key === currentFilter ? 'active' : ''}" data-key="${it.key}">
        <span class="tab-dot dot-${it.key}"></span>
        <span class="label">${_tabLbl(it)}</span>
        <span class="count">${count}</span>
      </div>`;
  }).join("");
  bar.querySelectorAll(".tab").forEach(el => {
    el.onclick = () => { currentFilter = el.dataset.key; render(); };
  });
}

function rowHTML(d) {
  const id = `${d.cat}_${d.file}`;
  const checked = selectedId === id ? "checked" : "";
  const selCls  = selectedId === id ? "selected" : "";
  const tooltip = d.path
    ? `${d.title}\n🪟 호스트: ${d.path}\n🍊 Orange3 (컨테이너): ${d.serverUrl || "(미배치)"}`
    : d.title;
  const locIcon = d.path ? `<span class="loc-icon" title="위치 정보 보유">📁</span>` : "";
  return `
    <div class="list-row ${selCls}" data-id="${id}" title="${tooltip}">
      <div class="col-select">
        <input type="radio" name="dataset-select" class="radio" value="${id}" ${checked}>
      </div>
      <div><span class="list-dot dot-${d.cat}"></span></div>
      <div class="col-title">${d.title} ${locIcon}<span class="file">${d.file}</span></div>
      <div class="col-desc">${_dsc(d)}</div>
      <div class="col-meta">
        <span class="meta-rows">${d.rows} rows</span>
        <span class="meta-feat">${d.feat}</span>
      </div>
    </div>`;
}

function listHeaderHTML() {
  return `
    <div class="list-header">
      <div style="text-align:center">${_ui('select')}</div>
      <div></div><div>Name</div><div>Description</div><div>Size</div>
    </div>`;
}

function render() {
  buildTabs();
  const content = document.getElementById("content");
  content.innerHTML = "";
  let pool = datasets.filter(d => currentFilter === "all" || d.cat === currentFilter);
  if (!pool.length) { content.innerHTML = `<div class="empty">${_ui('noData')}</div>`; return; }

  if (currentFilter === "all") {
    Object.keys(categoryLabels).forEach(cat => {
      const items = pool.filter(d => d.cat === cat);
      if (!items.length) return;
      const sec = document.createElement("div");
      sec.innerHTML = `
        <div class="section-title">${_catLbl(cat)} <span class="count">${items.length}${_ui('count')}</span></div>
        <div class="list">${listHeaderHTML()}${items.map(rowHTML).join("")}</div>`;
      content.appendChild(sec);
    });
  } else {
    content.innerHTML = `
      <div class="section-title">${_catLbl(currentFilter)} <span class="count">${pool.length}${_ui('count')}</span></div>
      <div class="list">${listHeaderHTML()}${pool.map(rowHTML).join("")}</div>`;
  }
}

document.getElementById("content").addEventListener("click", e => {
  const row = e.target.closest(".list-row"); if (!row) return;
  selectRow(row.dataset.id);
});
document.getElementById("content").addEventListener("dblclick", e => {
  const row = e.target.closest(".list-row"); if (!row) return;
  selectRow(row.dataset.id);
  if (IS_MODAL) applySelection();
});
if (IS_MODAL) {
  const btnApply  = document.getElementById("btnApply");
  const btnCancel = document.getElementById("btnCancel");
  if (btnApply)  btnApply.addEventListener("click", applySelection);
  if (btnCancel) btnCancel.addEventListener("click", cancelSelection);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") cancelSelection();
    if (e.key === "Enter" && selectedDataset && selectedDataset.serverUrl) applySelection();
  });
}

// 상단 바 닫기 버튼 — 취소(부모에 dataset-cancelled 전달)와 동일 동작
const _closeBtn = document.getElementById("closeBtn");
if (_closeBtn) _closeBtn.addEventListener("click", cancelSelection);

applyStaticI18n();
render();
</script>
