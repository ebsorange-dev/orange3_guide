<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "맑은 고딕", sans-serif;
    background: #fafafa;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #222;
  }
  .box {
    text-align: center;
    max-width: 520px;
    padding: 40px 20px;
  }
  .icon {
    font-size: 54px;
    color: #F47B20;
    line-height: 1;
    margin-bottom: 18px;
  }
  .title {
    font-size: 17px;
    color: #222;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .msg {
    font-size: 13px;
    color: #888;
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .hint {
    font-size: 11px;
    color: #aaa;
    opacity: 0.7;
    margin-bottom: 22px;
    font-family: Consolas, "SF Mono", monospace;
  }
  button {
    margin-top: 6px;
    padding: 10px 28px;
    border-radius: 6px;
    border: 0;
    background: #F47B20;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    transition: background .15s;
  }
  button:hover { background: #d96b10; }
  button:active { background: #b85a0d; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">⚠</div>
  <div class="title">페이지를 찾을 수 없습니다</div>
  <div class="msg">
    요청하신 페이지가 존재하지 않거나<br>
    이동되었을 수 있습니다.
  </div>
  <div class="hint">(404 not found)</div>
  <button onclick="location.href='/'">처음으로</button>
</div>
</body>
</html>
