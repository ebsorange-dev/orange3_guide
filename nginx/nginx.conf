# =============================================================================
# Orange3 Session Manager — Nginx 정적 오프로드 + Reverse Proxy
# =============================================================================
# 목적:
#   1) 정적 자산(.png/.svg/.css/.js/.woff/.ico 등)을 Nginx 가 직접 서빙해
#      FastAPI 이벤트 루프 부하를 분리
#   2) FastAPI 의 /logo, /splash-image, /footer-logo, /splash-mascot,
#      /splash-loading 핸들러를 정적 경로로 alias → 즉시 서빙
#   3) 그 외 모든 요청(/api, SSE, WS, 동적 페이지)은 session-manager 로 패스
#
# SSE / WebSocket 호환:
#   - proxy_buffering off  : SSE 첫 이벤트 버퍼링 방지 (이미 main.py 에 적용된
#                            Content-Encoding: identity 패턴과 별개로 nginx 단도 차단)
#   - proxy_read_timeout 24h : 장시간 SSE 연결 유지
#   - http_upgrade / connection upgrade : WebSocket (noVNC, Xpra)
#
# 운영 무중단 적용 절차:
#   1) docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d nginx
#   2) 정상 동작 확인 후 호스트 8888 매핑을 nginx 로 전환
#   3) 문제 시 docker compose stop nginx 후 원상 복귀
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ── 기본 ────────────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 로그 (정적 자산은 access_log off 로 부하 최소화)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main buffer=32k flush=5s;
    error_log   /var/log/nginx/error.log   warn;

    # ── 성능 튜닝 ──────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 200M;   # /upload 등 대용량 multipart 대응
    client_body_buffer_size 128k;

    # ── 압축 (정적 자산만) ─────────────────────────────────────────────────
    # 이미 이미지(.png/.svg) 는 compress 효율 낮음 — text 계열만 압축
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;
    gzip_disable "msie6";

    # ── upstream: session-manager FastAPI ──────────────────────────────────
    upstream session_manager_upstream {
        # 컨테이너 이름으로 접근. docker compose 네트워크 내부에서 DNS 해석.
        server orange3-session-manager:8080;
        keepalive 64;
    }

    # ── 서버 블록 ──────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # 0) ─── 커스텀 에러 페이지 (502 / 503 / 504 / 404) ─────────────────
        # upstream session-manager 가 죽었을 때 nginx 가 자체적으로 친화 에러
        # 페이지를 서빙. 본문 디자인은 main.py 의 _friendly_error_page() 와
        # 동일 톤 (⚠ + 제목 + 메시지 + 다시 시도 버튼).
        # /__nginx_errors__/ 는 외부 노출 금지 (internal).
        error_page 500 502 503 504 /__nginx_errors__/50x.html;
        error_page 404               /__nginx_errors__/404.html;

        location ^~ /__nginx_errors__/ {
            internal;                       # 외부 직접 호출 차단
            alias /etc/nginx/errors/;
            add_header Cache-Control "no-store" always;
            charset utf-8;
        }

        # 1) ─── 정적 자산: /static/* (alias 로 디스크 직접 서빙) ──────────
        # html/ 폴더는 docker-compose 로 /app/html 에 마운트되므로,
        # nginx 컨테이너에도 동일 폴더를 ro 로 마운트하고 alias 로 연결.
        location /static/html/ {
            alias /srv/html/;
            access_log off;
            expires 7d;     # html 폴더 내 이미지·HTML — 1주 캐시
            add_header Cache-Control "public, max-age=604800";
            add_header X-Served-By "nginx-static" always;
            try_files $uri =404;
        }

        location = /static/orange_logo.png {
            alias /srv/orange_logo.png;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Served-By "nginx-static" always;
        }

        # 2) ─── 기존 FastAPI 정적 핸들러 → Nginx alias 로 가로채기 ────────
        # session-manager 의 /logo, /splash-image 등 핸들러는 그대로 두되,
        # Nginx 가 우선 매칭하여 FastAPI 까지 가지 않도록 처리.
        # ※ 이 블록을 활성화하려면 main.py 의 fallback 동작이 유지되어야 함.
        #   (Nginx 다운 시에도 FastAPI 직접 서빙으로 fallback)

        location = /logo {
            alias /srv/orange_logo.png;
            # 요청 URI(/logo)에 확장자가 없어 nginx 가 mime.types 매칭에 실패하면
            # default_type(application/octet-stream) 으로 폴백한다. FastAPI 원본은
            # image/png 를 주므로 동일하게 명시 (Stage 2 전환 시 mime 불일치 방지).
            default_type image/png;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Served-By "nginx-static-fastpath" always;
            try_files $uri @fastapi;  # 파일 없으면 FastAPI fallback
        }

        # /splash-image, /footer-logo, /splash-mascot, /splash-loading 는
        # FastAPI 핸들러가 여러 후보 파일(.png/.svg/.jpg) 중 첫 매치를
        # 동적으로 선택하므로 Nginx alias 로 단순 치환 시 동작 불일치 가능.
        # → 안전성 우선: 이 4개는 reverse-proxy 유지 (변경 안 함).
        #   변경 시 각 핸들러의 우선순위 파일 확정 후 alias 가능.

        # 3) ─── SSE 채널 ──────────────────────────────────────────────────
        # GZip 우회 + 무제한 timeout. main.py 의 _is_sse_path 와 정렬.
        location ~ ^/(stream|events|sse|console-stream|status-stream) {
            proxy_pass http://session_manager_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 핵심
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            chunked_transfer_encoding off;
            gzip off;

            # Accel-Buffering 헤더 (Nginx 가 일부 응답을 강제 버퍼링하는 것 방지)
            add_header X-Accel-Buffering "no" always;
        }

        # 4) ─── WebSocket (noVNC, Xpra) ───────────────────────────────────
        location ~ ^/(novnc|websockify|ws|xpra) {
            proxy_pass http://session_manager_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket 장시간 유지
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            proxy_buffering off;
        }

        # 5) ─── 폴링/스트림 무캐시 경로 ───────────────────────────────────
        location ~ (/screenshot|-poll|/ready|/ping|/dataset-poll|/pc_download/check) {
            proxy_pass http://session_manager_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-store" always;
        }

        # 6) ─── 기본: 모든 요청 → FastAPI ──────────────────────────────────
        location / {
            proxy_pass http://session_manager_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";   # upstream keepalive 사용

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;
        }

        # 7) ─── FastAPI fallback 명명 location ────────────────────────────
        location @fastapi {
            proxy_pass http://session_manager_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 8) ─── 헬스체크 (compose healthcheck 용) ─────────────────────────
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
